name: Build VIKALP Voice Studio Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Project and Auto-Patch Build Settings
        run: |
          python3 -c "
          import re, base64, os, zipfile, json

          # Extract project from HTML archive
          for hf in [f for f in os.listdir('.') if f.endswith('.html')]:
              content = open(hf, 'r', encoding='utf-8').read()
              m = re.search(r'const b64Data = \"([^\"]+)\";', content)
              if m:
                  open('proj.zip', 'wb').write(base64.b64decode(m.group(1)))
                  with zipfile.ZipFile('proj.zip', 'r') as z:
                      z.extractall('.')
                  print('Extracted project successfully!')
                  break

          # Patch package.json to use direct vite build
          if os.path.exists('package.json'):
              pkg = json.load(open('package.json'))
              pkg['scripts']['build'] = 'vite build'
              json.dump(pkg, open('package.json', 'w'), indent=2)

          # Patch tsconfig.json
          if os.path.exists('tsconfig.json'):
              cfg = json.load(open('tsconfig.json'))
              cfg['compilerOptions']['strict'] = False
              cfg['compilerOptions']['noImplicitAny'] = False
              cfg['compilerOptions']['skipLibCheck'] = True
              json.dump(cfg, open('tsconfig.json', 'w'), indent=2)
          "
          ls -la

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Ensure Gradle Wrapper & Build APK
        run: |
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.2.1 || true
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate & Rename Generated APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} build-output/Vikalp-AI-Voice-Studio-debug.apk \;
          ls -la build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vikalp-AI-Voice-Studio-APK
          path: build-output/Vikalp-AI-Voice-Studio-debug.apk
          retention-days: 30

      - name: Create GitHub Release for Direct Mobile Download
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: VIKALP AI Voice Studio v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## 🎉 VIKALP AI VOICE STUDIO — Android Release
            Install directly on your phone:
          files: build-output/Vikalp-AI-Voice-Studio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
